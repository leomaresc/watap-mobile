# Análisis estático de WATAP Mobile.
#
# Se parte del conjunto recomendado oficial (flutter_lints) y se añaden unas
# pocas reglas adicionales orientadas a evitar errores reales. No se desactiva
# ninguna comprobación para "hacer pasar" el análisis.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Un `print` accidental en producción debe ser un error, no un aviso.
    avoid_print: error
    # Evita dejar futuros sin esperar por descuido.
    unawaited_futures: warning
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
